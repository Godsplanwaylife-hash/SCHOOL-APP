{% extends "base.html" %}
{% block content %}
<div class="auth-card">
  <img class="auth-logo" src="{{ url_for('static', filename='logo.webp') }}" alt="School logo">
  <h2>School Login</h2>
  <p class="subtitle">Sign in to continue</p>
  <form method="POST">
    {{ form.hidden_tag() }}
    {{ form.email.label }} {{ form.email() }}
    {{ form.password.label }}
    <div class="password-field">
      {{ form.password() }}
      <button type="button" class="toggle-password" onclick="var i=this.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; this.textContent = i.type === 'password' ? 'Show' : 'Hide';">Show</button>
    </div>
    <div class="checkbox-row">{{ form.remember() }} {{ form.remember.label }}</div>
    {{ form.submit() }}
  </form>
  <p class="links"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
</div>
{% endblock %}
