{% extends "base.html" %}
{% block content %}
<h2>Forgot Password</h2>
<p>Enter your email and we will send you a reset link.</p>
<form method="POST">
  {{ form.hidden_tag() }}
  {{ form.email.label }} {{ form.email() }}
  {% for error in form.email.errors %}<small class="flash error">{{ error }}</small>{% endfor %}
  {{ form.submit() }}
</form>
<p><a href="{{ url_for('login') }}">Back to login</a></p>
{% endblock %}
